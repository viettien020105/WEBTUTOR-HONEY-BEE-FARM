<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 100%;
            height: 100%;
        }
        .pano-advert{
            width: 100%;
            height: 48px;
            border: 1px solid black;
            display: flex;
            justify-content: center;
        }
        .content-advert{
            width: 550px;
            height: 100%;
            display: flex;
        }
        .logo-advert{
            width: 62px;
            height: 100%;
            background-color: yellow;
        }
        .text-advert{
            width: 488px;
            height: 100%;
            background-color: rgb(138, 244, 138);
        }
        .header{
            width: 100%;
            height: 80px;
            border: 1px solid black;
            display: flex;
            justify-content: center;
        }
        .box-content-header{
            width: 1200px;
            height: 100%;
            display: flex;
        }
        .nav{
            width: 42%;
            height: 100%;
            background-color: aqua;
        }
        .logo-web{
            width: 16%;
            height: 100%;
            background-color: beige;
        }
        .feature{
            width: 42%;
            height: 100%;
            background-color: aquamarine;
        }
        .box-products{
            width: 100%;
            height: 1900px;
            border: 1px solid black;
            display: flex;
            justify-content: space-around;
            flex-direction: column;
            align-items: center;
        }
        .box-title{
            width: 1200px;
            height: 2%;
            border: 1px solid black;
        }
        .box-product{
            width: 1200px;
            height: 90%;
            border: 1px solid black;
            display: flex;
            justify-content: space-between;
        }
        .box-cate{
            width: 23%;
            height: 25%;
            border: 1px solid black;
        }
        .products{
            width: 75%;
            height: 100%;
            /* border: 1px solid black; */
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        .title-products{
            width: 100%;
            height: 3%;
            border: 1px solid black;

        }
        .product{
            width: 100%;
            height: 85%;
            /* border: 1px solid black; */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .page{
            width: 100%;
            height: 4%;
            border: 1px solid black;

        }
        .row{
            width: 100%;
            height: 23%;
            /* border: 1px solid black; */
            display: flex;
            justify-content: space-between;
        }
        .column{
            width: 31%;
            height: 100%;
            border: 1px solid black;
        }
        .title-cate{
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pano-advert">
            <div class="content-advert">
                <div class="logo-advert">logo</div>
                <div class="text-advert">content</div>
            </div>
        </div>
        <div class="header">
            <div class="box-content-header">
                <div class="nav">nav</div>
                <div class="logo-web">logo-web</div>
                <div class="feature">other feature</div>
            </div>
        </div>
        <div class="box-products">
            <div class="box-title">Trang Chủ / All Products</div>
            <div class="box-product">
                <div class="box-cate">
                    <div class="title-cate"></div>
                    <div class="content-cate"></div>
                </div>
                <div class="products">
                    <div class="title-products"></div>
                    <div class="product">
                        <div class="row">
                            <div class="column"></div>
                            <div class="column"></div>
                            <div class="column"></div>
                        </div>
                        <div class="row">
                            <div class="column"></div>
                            <div class="column"></div>
                            <div class="column"></div>
                        </div>
                        <div class="row">
                            <div class="column"></div>
                            <div class="column"></div>
                            <div class="column"></div>
                        </div>
                        <div class="row">
                            <div class="column"></div>
                            <div class="column"></div>
                            <div class="column"></div>
                        </div>
                    </div>
                    <div class="page"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/homeheader.css">
    <link rel="stylesheet" href="/css/products.css">
    <title>Document</title>
    <style>
        
        
     
       
        

        
        
        
       
        .box-footer{
            width: 100%;
            height: 400px;
            border: 1px solid black;
            display: flex;
            align-items: center;
            flex-direction: column;
        }
        .box-content-footer{
            width: 100%;
            height: 90%;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box-advert{
            width: 100%;
            height: 10%;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .content-footer{
            width: 1200px;
            height: 70%;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pano-advert">
            <div class="content-advert">
                <div class="logo-advert">
                    <img src="/images/bee_header.webp" alt="">
                </div>
                <div class="text-advert">
                    <p>MIỄN PHÍ VẬN CHUYỂN TRÊN MỌI ĐƠN HÀNG</p>
                </div>
            </div>
        </div>
        <div class="header">
            <div class="box-content-header">
                <div class="nav">
                    <div class="nav1">
                        <p>Trang chủ</p>
                    </div>
                    <div class="nav2">
                        <div class="nav2-box">
                            <p>Sản phẩm</p>
                            <i class="fa-solid fa-angle-down"></i>
                        </div>
                    </div>
                    <div class="nav3">
                        <p>Tin tức</p>
                    </div>
                    <div class="nav4">
                        <p>Liên hệ</p>
                    </div>
                    <div class="nav1">

                    </div>
                </div>
                <div class="logo-web">

                <div class="feature">
                    <div class="box-feature">
                        <div class="box-number">
                            <div class="box-number-text"><b>HOTLINE:</b></div>
                            <div class="box-number-number">0868353074</div>
                        </div>
                        <div class="box-account">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div class="box-search">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                        <div class="box-cart">
                            <i class="fa-solid fa-cart-shopping"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="slider">
            <img src="/images/slider_1.webp" alt="">
        </div>
        <div class="box-product-detail">
            <div class="box-content">
                <div class="box-product">
                    <div class="product">
                        <div class="image">
                            <img src="/images/product1.webp" alt="">

                    </div>
                    <div class="similar-product">
                        <div class="p1">
                            <img src="/images/product1.webp" alt="">

                        <div class="p1">
                            <img src="/images/product2.webp" alt="">
                        </div>
                        <div class="p1">
                            <img src="/images/product3.webp" alt="">
                        </div>
                        <div class="p1">
                            <img src="/images/product4.webp" alt="">
                        </div>
                        <div class="p1">
                            <img src="/images/product5.webp" alt="">
                        </div>
                    </div>
                </div>
                <div class="box-info"></div>
            </div>
        </div>
        <div class="product-advert">
            <div class="box-product-advert">
                <div class="box-title-hot"><h2>MẬT ONG BÁN CHẠY NHẤT</h2></div>
                <div class="products">
                    <div class="product-details">
                        <div class="image-details"></div>
                        <div class="content-details"></div>
                    </div>
                    <div class="product-details">
                        <img src="/images/product7.webp" alt="">

                    <div class="product-details">

                    <div class="product-details">

                <div class="title-similar-product"></div>

                    <div class="step"></div>
                    <div class="step"></div>
                    <div class="step"></div>
                    <div class="step"></div>
                </div>
            </div>
        </div>
        <div class="box-infor">
            <div class="infor">
                <div class="title-infor">Tin Tức</div>
                <div class="content-infor">
                    <div class="infor1"></div>
                    <div class="infor1"></div>
                    <div class="infor1"></div>
                    <div class="infor1"></div>
                </div>
            </div>
        </div>
        <div class="box-footer">
            <div class="box-content-footer">
                <div class="content-footer"></div>
            </div>
            <div class="box-advert">
                <p>Bản quyền thuộc về...</p>
            </div>
        </div>

</html>
